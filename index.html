<style>
/* Postcard — email war room. Same house as Cartography (Sen, Plex Mono, rail, sheet, vault); postal navy instead of forest.
   Views: Today · Email spy · Steal boards · Inspo · Brands · Learning hub · Archive · Saved. One sheet for any email,
   with their email and our version side by side. */
:root {
  --bg: #F5F4EF; --surface: #FFFFFF; --sunk: #EEECE5; --ink: #1E2220; --ink-2: #3A3F3B; --muted: #6D695C; --line: #E3E0D6;
  --brand: #22313F; --on-brand: #F5F4EF; --acc: #4E6C8A; --acc-soft: #E4EAF1; --gold: #A87A2E; --gold-soft: #F4EBDB;
  --sage: #6F8F78; --sage-soft: #E5ECE5; --rose: #A65F5F; --rose-soft: #F5E6E3; --sand: #C9B98F; --good: #3F7A4E;
  --tof: #4E6C8A; --mof: #6F8F78; --bof: #B0553A; --ret: #A87A2E; --win: #7A6191;
  --shadow: 0 1px 2px rgba(30, 34, 32, .06), 0 4px 16px rgba(30, 34, 32, .06);
  --shadow-lift: 0 2px 4px rgba(30, 34, 32, .08), 0 12px 32px rgba(30, 34, 32, .12);
  --scrim: rgba(20, 22, 20, .5);
  --font: "Sen", "Helvetica Neue", Arial, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 12px; --r-sm: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121519; --surface: #1A1F24; --sunk: #232A31; --ink: #ECEAE3; --ink-2: #D2D0C8; --muted: #A39E8C; --line: #2E353C;
  --brand: #D7E0EA; --on-brand: #121519; --acc: #8EAACB; --acc-soft: #22303D; --gold: #D9B26B; --gold-soft: #3A3121;
  --sage: #8FB399; --sage-soft: #26332A; --rose: #D08B8B; --rose-soft: #3A2626; --sand: #8C7F5E; --good: #7FC08F;
  --tof: #8EAACB; --mof: #8FB399; --bof: #DB8A6E; --ret: #D9B26B; --win: #B39AC7;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); --shadow-lift: 0 2px 6px rgba(0,0,0,.4), 0 14px 36px rgba(0,0,0,.45);
  --scrim: rgba(0,0,0,.65); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121519; --surface: #1A1F24; --sunk: #232A31; --ink: #ECEAE3; --ink-2: #D2D0C8; --muted: #A39E8C; --line: #2E353C;
  --brand: #D7E0EA; --on-brand: #121519; --acc: #8EAACB; --acc-soft: #22303D; --gold: #D9B26B; --gold-soft: #3A3121;
  --sage: #8FB399; --sage-soft: #26332A; --rose: #D08B8B; --rose-soft: #3A2626; --sand: #8C7F5E; --good: #7FC08F;
  --tof: #8EAACB; --mof: #8FB399; --bof: #DB8A6E; --ret: #D9B26B; --win: #B39AC7;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); --shadow-lift: 0 2px 6px rgba(0,0,0,.4), 0 14px 36px rgba(0,0,0,.45);
  --scrim: rgba(0,0,0,.65); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.mono { font-family: var(--mono); }
.label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
[hidden] { display: none !important; }

/* shell */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 20px 14px 18px max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 22px; border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; }
.logo { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.logo svg { width: 38px; height: 38px; flex: none; filter: drop-shadow(0 2px 6px rgba(20, 30, 45, .25)); }
.logo b { display: block; font-size: 20px; font-weight: 800; letter-spacing: -.025em; line-height: 1.05; }
.logo b em, .lock-card b em { font-style: normal; color: var(--gold); }
.logo span { display: block; margin-top: 3px; font-size: 9.5px; white-space: nowrap; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.nav { display: grid; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 11px; border: 0; background: none; padding: 9px 10px; border-radius: var(--r-sm); text-align: left; font-weight: 600; color: var(--ink-2); transition: background .15s, color .15s; }
.nav button:hover { background: var(--sunk); }
.nav button[aria-current="page"] { background: var(--acc-soft); color: var(--brand); }
.nav button[aria-current="page"] svg.i { color: var(--acc); }
.nav .n { margin-left: auto; font-size: 11.5px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.nav .sep { height: 1px; background: var(--line); margin: 8px 6px; }
.side-foot { margin-top: auto; display: grid; gap: 8px; padding: 12px; border-radius: var(--r); background: var(--sunk); font-size: 12px; color: var(--muted); }
.side-foot b { color: var(--ink); font-weight: 700; }
.side-foot .warn { color: var(--rose); display: flex; gap: 6px; align-items: flex-start; }
.side-foot .credit { display: flex; align-items: center; gap: 7px; padding-top: 8px; border-top: 1px solid var(--line); }
.side-foot .credit i { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 10.5px; font-weight: 800; background: var(--gold-soft); color: var(--gold); }
.pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px; animation: pulse 2.4s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(63, 122, 78, .45); } 70% { box-shadow: 0 0 0 8px rgba(63, 122, 78, 0); } 100% { box-shadow: 0 0 0 0 rgba(63, 122, 78, 0); } }
.main { min-width: 0; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 14px; padding: 14px max(24px, env(safe-area-inset-right, 0px)) 14px 28px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.015em; white-space: nowrap; }
.top p { margin: 0; font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.top > div:first-child { min-width: 0; flex: 1; }
.tools { margin-left: auto; display: flex; gap: 8px; align-items: center; flex: none; }
.search { position: relative; width: min(300px, 30vw); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 14px 9px 36px; font-size: 13.5px; }
.iconbtn { width: 38px; height: 38px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink-2); }
.iconbtn:hover { background: var(--sunk); }
.daypick { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px; }
.daypick button { border: 0; background: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); }
.daypick button:hover:not(:disabled) { background: var(--sunk); }
.daypick button:disabled { opacity: .3; cursor: default; }
.daypick span { font-weight: 700; font-size: 13px; padding: 0 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.content { padding: 24px max(24px, env(safe-area-inset-right, 0px)) 80px 28px; max-width: 1640px; }
.view { animation: fade .28s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }

/* panels, kpis */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--shadow); min-width: 0; }
.panel h3 { margin: 0 0 3px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.panel .sub { margin: 0 0 14px; font-size: 12.5px; color: var(--muted); }
.grid { display: grid; gap: 16px; }
.stack { display: grid; gap: 16px; }
.kpis { grid-template-columns: repeat(6, minmax(0, 1fr)); }
@media (max-width: 1280px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { position: relative; padding: 15px 17px; display: grid; gap: 5px; overflow: hidden; }
.kpi .ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--acc-soft); color: var(--acc); }
.kpi .ic.g { background: var(--gold-soft); color: var(--gold); } .kpi .ic.s { background: var(--sage-soft); color: var(--sage); } .kpi .ic.r { background: var(--rose-soft); color: var(--rose); }
.kpi b { font-size: 27px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi b small { font-size: 14px; color: var(--muted); font-weight: 700; margin-left: 2px; }
.kpi span { font-size: 12.5px; color: var(--muted); }
.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.row-a { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
@media (max-width: 1180px) { .cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .row-a { grid-template-columns: 1fr; } }
@media (max-width: 760px) { .cols-2, .cols-3 { grid-template-columns: 1fr; } }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: center; background: linear-gradient(135deg, var(--surface) 30%, var(--acc-soft)); padding: 22px 24px; }
.hero .when { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hero h2 { margin: 8px 0 8px; font-size: 23px; line-height: 1.25; font-weight: 800; letter-spacing: -.015em; text-wrap: balance; }
.hero p.lede { margin: 0; color: var(--ink-2); font-size: 14px; }
.stand { position: relative; height: 196px; }
.stand button { position: absolute; width: 112px; aspect-ratio: 4 / 5; padding: 0; border: 3px solid var(--surface); border-radius: 10px; overflow: hidden; background: var(--sunk); box-shadow: var(--shadow-lift); transition: transform .25s cubic-bezier(.2,.8,.2,1), z-index 0s; }
.stand button img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.stand button:hover { transform: translateY(-8px) rotate(0deg) scale(1.04) !important; z-index: 9; }
@media (max-width: 980px) { .hero { grid-template-columns: 1fr; } .stand { display: none; } }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: var(--sunk); color: var(--ink-2); white-space: nowrap; border: 0; }
.chip.f-TOF { background: color-mix(in srgb, var(--tof) 16%, transparent); color: var(--tof); }
.chip.f-MOF { background: color-mix(in srgb, var(--mof) 18%, transparent); color: var(--mof); }
.chip.f-BOF { background: color-mix(in srgb, var(--bof) 16%, transparent); color: var(--bof); }
.chip.f-RET { background: color-mix(in srgb, var(--ret) 18%, transparent); color: var(--ret); }
.chip.f-WIN { background: color-mix(in srgb, var(--win) 18%, transparent); color: var(--win); }
.chip.gold { background: var(--gold-soft); color: var(--gold); }
.chip.rose { background: var(--rose-soft); color: var(--rose); }
.chip.ghost { background: none; border: 1px solid var(--line); color: var(--muted); font-weight: 600; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
button.chip { cursor: pointer; }
button.chip[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }

/* plan strip */
.planstrip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; padding: 0; overflow: hidden; }
.planstrip > div { padding: 14px 18px; border-right: 1px solid var(--line); min-width: 0; }
.planstrip > div:last-child { border-right: 0; }
.planstrip b { display: block; font-size: 14.5px; font-weight: 700; margin-top: 4px; line-height: 1.35; }
.planstrip small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.cd { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.cd span { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 7px; background: var(--sunk); white-space: nowrap; }
.cd span i { font-style: normal; color: var(--gold); margin-left: 4px; font-variant-numeric: tabular-nums; }
@media (max-width: 1180px) { .planstrip { grid-template-columns: repeat(2, minmax(0, 1fr)); } .planstrip > div:nth-child(2) { border-right: 0; } .planstrip > div:nth-child(-n+2) { border-bottom: 1px solid var(--line); } }
@media (max-width: 560px) { .planstrip { grid-template-columns: 1fr; } .planstrip > div { border-right: 0; border-bottom: 1px solid var(--line); } }

/* moves */
.moves { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1180px) { .moves { grid-template-columns: 1fr; } }
.move { display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px; position: relative; padding-top: 20px; }
.move .no { position: absolute; top: -12px; left: 18px; width: 28px; height: 28px; border-radius: 9px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-weight: 800; font-size: 13px; box-shadow: var(--shadow); }
.move h4 { margin: 0; font-size: 16px; line-height: 1.3; }
.move p { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.move .why { font-size: 12.5px; color: var(--muted); }
.refs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.refs button { width: 44px; height: 55px; padding: 0; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--sunk); transition: transform .15s; }
.refs button:hover { transform: translateY(-2px); }
.refs img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.when-tag { font-size: 11.5px; font-weight: 700; color: var(--gold); }

/* charts */
.bars { display: grid; gap: 7px; }
.bars .b { display: grid; grid-template-columns: minmax(90px, 150px) minmax(0, 1fr) 40px; align-items: center; gap: 10px; font-size: 13px; }
.bars .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { height: 10px; border-radius: 99px; background: var(--sunk); position: relative; overflow: hidden; }
.track i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 99px; background: var(--acc); transition: width .7s cubic-bezier(.2, .8, .2, 1); }
.bars .n { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.donut { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.donut svg { width: 140px; height: 140px; flex: none; }
.donut circle { transition: stroke-dasharray .8s cubic-bezier(.2, .8, .2, 1); }
.legend { display: grid; gap: 6px; font-size: 13px; }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend b { margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums; }
.heat { display: grid; grid-template-columns: 34px repeat(24, minmax(0, 1fr)); gap: 3px; font-size: 10.5px; color: var(--muted); }
.heat i { aspect-ratio: 1; border-radius: 3px; background: var(--sunk); display: block; }
.heat span { display: flex; align-items: center; }
.heat .hh { grid-column: 2 / -1; display: flex; justify-content: space-between; }

/* email cards + wall */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar .count { font-weight: 700; margin-right: 4px; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--sunk); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 13px; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.btn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.wall { display: grid; gap: 16px; align-items: start; }
.col { display: grid; gap: 16px; align-content: start; min-width: 0; }
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); transition: transform .18s, box-shadow .18s; cursor: pointer; animation: rise .4s both; }
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
.media { position: relative; aspect-ratio: 4 / 5; background: var(--sunk); overflow: hidden; }
.media > img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; opacity: 0; transition: opacity .35s; }
.media > img.on { opacity: 1; }
.media .ov { position: absolute; left: 10px; top: 10px; right: 50px; display: flex; gap: 5px; flex-wrap: wrap; }
.media .ov .chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.media .ov .chip { box-shadow: 0 1px 6px rgba(0,0,0,.12); background: color-mix(in srgb, var(--surface) 92%, transparent); }
.save { position: absolute; right: 10px; top: 10px; width: 32px; height: 32px; border-radius: 50%; border: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--surface) 90%, transparent); color: var(--ink-2); box-shadow: 0 1px 6px rgba(0,0,0,.12); }
.save[aria-pressed="true"] { color: var(--gold); }
.save[aria-pressed="true"] svg { fill: currentColor; }
.card .body { padding: 11px 13px 13px; display: grid; gap: 6px; }
.who { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); min-width: 0; }
.who b { color: var(--ink); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.av { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 800; color: #fff; flex: none; }
.who .t { margin-left: auto; white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.subj { font-weight: 700; font-size: 13.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .steal { font-size: 12.5px; color: var(--ink-2); border-top: 1px dashed var(--line); padding-top: 7px; }
.card .steal b { color: var(--gold); font-weight: 700; }
.score { display: inline-flex; gap: 2px; }
.score i { width: 6px; height: 6px; border-radius: 2px; background: var(--line); }
.score i.on { background: var(--gold); }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }
.empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }

/* steal boards */
.boardhead { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; margin-bottom: 16px; }
.boardhead h2 { margin: 0; font-size: 20px; }
.boardhead p { margin: 2px 0 0; color: var(--muted); font-size: 13px; max-width: 560px; }
.ref { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 14px; padding: 12px; cursor: pointer; }
.ref .media { border-radius: 9px; }
.ref .t { display: grid; gap: 7px; align-content: start; min-width: 0; }
.ref .k { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 800; color: var(--muted); }
.ref .s { font-size: 13.5px; color: var(--ink); }
.ref .u { font-size: 13px; color: var(--ink-2); background: var(--gold-soft); border-radius: 8px; padding: 8px 10px; }
.ref .u b { color: var(--gold); }
@media (max-width: 560px) { .ref { grid-template-columns: 110px minmax(0, 1fr); } }

/* inspo */
.subjrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.subjrow:first-child { border-top: 0; }
.subjrow .q { font-weight: 700; font-size: 14px; }
.subjrow small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.copy { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 9px; font-size: 12px; font-weight: 700; color: var(--ink-2); display: inline-flex; gap: 5px; align-items: center; }
.copy:hover { background: var(--sunk); }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: 132px; gap: 10px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }

.lay { padding: 14px 0; border-top: 1px solid var(--line); }

.lay h4 { margin: 0 0 8px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.pal { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.pal .p { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); cursor: pointer; }
.pal .sw { display: flex; height: 54px; }
.pal .sw i { flex: 1; }
.pal .p div:last-child { padding: 7px 10px; font-size: 12px; display: flex; justify-content: space-between; gap: 8px; }
.pal .p small { color: var(--muted); font-family: var(--mono); font-size: 10.5px; }
.cloud { display: flex; flex-wrap: wrap; gap: 6px; }

/* brands */
.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.bcard { cursor: pointer; display: grid; gap: 12px; transition: transform .18s, box-shadow .18s; }
.bcard:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
.bcard .h { display: flex; gap: 10px; align-items: center; }
.bcard .h .av { width: 34px; height: 34px; font-size: 13px; }
.bcard .h b { font-size: 15px; display: block; }
.bcard .h small { color: var(--muted); font-size: 12px; }
.bcard .st { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.bcard .st div { background: var(--sunk); border-radius: 8px; padding: 7px 9px; }
.bcard .st b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
.bcard .st span { font-size: 11px; color: var(--muted); }
.fbar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--sunk); }
.fbar i { display: block; height: 100%; }
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.thumbs div { aspect-ratio: 4 / 5; border-radius: 7px; overflow: hidden; background: var(--sunk); border: 1px solid var(--line); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }

/* plan + archive */
.rule { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.rule:first-child { border-top: 0; }
.rule time { font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding-top: 2px; }
.rule.offer { }
.rule mark { background: var(--gold-soft); color: inherit; padding: 0 3px; border-radius: 3px; }
.tl { position: relative; display: grid; gap: 0; }
.tl .ev { display: grid; grid-template-columns: 82px 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; }
.tl .ev .d { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }
.tl .ev .dot { width: 12px; height: 12px; border-radius: 50%; border: 3px solid var(--acc); background: var(--surface); justify-self: center; position: relative; z-index: 1; }
.tl .ev.now .dot { background: var(--gold); border-color: var(--gold); }
.tl .ev b { font-size: 14px; }
.tl .ev small { display: block; color: var(--muted); font-size: 12px; }
.tl::before { content: ""; position: absolute; left: 100px; top: 12px; bottom: 12px; width: 2px; background: var(--line); }
.tl .ev .mk { display: flex; gap: 6px; }
.calx { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.calx .dw { font-size: 11px; color: var(--muted); font-weight: 700; padding: 0 4px; }
.dc { border-radius: 12px; min-width: 0; }
.dc.pad { visibility: hidden; }
.dc.off { align-self: start; padding: 9px 11px; font-size: 13px; font-weight: 700; color: var(--muted); opacity: .45; }   /* no war room: just the date, no box */
button.dc { display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px; text-align: left; padding: 9px 10px 10px; border: 1px solid var(--line); background: var(--surface); transition: transform .15s, border-color .15s, box-shadow .15s; }
button.dc:hover { transform: translateY(-2px); border-color: var(--acc); box-shadow: var(--shadow-lift); }
.dc .dtop { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.dc .dn { font-weight: 800; font-size: 15px; }
.dc .ct { font-size: 11px; color: var(--muted); font-weight: 700; white-space: nowrap; }
.th3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.th3 i { aspect-ratio: 4 / 5; border-radius: 5px; overflow: hidden; background: var(--sunk); display: block; }
.th3 img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; opacity: 0; transition: opacity .3s; }
.th3 img.on { opacity: 1; }
.dc .hl { font-size: 12px; line-height: 1.38; font-weight: 600; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; hyphens: auto; }
.dc .src, .agenda .src { font-size: 10.5px; font-weight: 800; letter-spacing: .04em; color: var(--muted); }
.dc .src.b, .agenda .src.b { color: var(--good); }
.dc.today { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-soft); }
.dc.sel { border-color: var(--acc); background: var(--acc-soft); }
.monthhead { display: flex; gap: 10px 18px; align-items: baseline; flex-wrap: wrap; margin-bottom: 14px; }
.monthhead h3 { margin: 0; font-size: 18px; }
.monthhead span { font-size: 12.5px; color: var(--muted); }
.monthhead b { color: var(--ink); }
.agenda { display: none; }
.agenda .ar { display: grid; grid-template-columns: 46px 84px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
.agenda .ar:first-child { border-top: 0; padding-top: 2px; }
.agenda .date { text-align: center; line-height: 1.1; }
.agenda .date b { display: block; font-size: 20px; }
.agenda .date small { font-size: 11px; color: var(--muted); font-weight: 700; }
.agenda .hl { font-size: 13.5px; font-weight: 700; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.agenda .m { display: block; margin-top: 3px; font-size: 12px; color: var(--muted); }
.agenda .ar.today .date b { color: var(--gold); }
@media (max-width: 980px) { .calx { display: none; } .agenda { display: grid; } }   /* seven day cards need ~130px each */
/* email pipeline: one week per row, each send a card coloured by funnel stage; promo days carry a gold wash */
.plhead { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; margin-bottom: 12px; }
.plhead span { font-size: 12.5px; color: var(--muted); } .plhead b { color: var(--ink); }
.phases { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
.phase { border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; font-size: 12px; line-height: 1.4; background: var(--surface); max-width: 100%; }
.phase b { display: block; font-size: 12.5px; }
.calx.pl { gap: 6px; }
.pd { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 7px; min-width: 0; min-height: 96px; display: flex; flex-direction: column; gap: 6px; }
.pd.past { opacity: .55; } .pd.out { visibility: hidden; }
.pd.promo { background: color-mix(in srgb, var(--gold-soft) 70%, var(--surface)); border-color: color-mix(in srgb, var(--gold) 35%, var(--line)); }
.pd.today { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-soft); }
.pd .pdt { display: flex; justify-content: space-between; gap: 4px; align-items: baseline; font-size: 13px; font-weight: 800; }
.pd .pdt small { font-size: 10.5px; font-weight: 700; color: var(--gold); text-align: right; overflow-wrap: anywhere; }
.sl { display: block; width: 100%; text-align: left; border: 0; border-left: 3px solid var(--line); border-radius: 7px; padding: 6px 7px; background: var(--sunk); cursor: pointer; min-width: 0; font: inherit; color: inherit; }
.sl:hover { background: var(--acc-soft); }
.sl .t { display: block; font-size: 10.5px; font-weight: 800; color: var(--muted); letter-spacing: .02em; }
.sl .s { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-size: 12px; font-weight: 700; line-height: 1.3; margin: 2px 0; overflow-wrap: anywhere; }
.sl .c { display: block; font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sl.f-TOF { border-left-color: var(--tof); } .sl.f-MOF { border-left-color: var(--mof); } .sl.f-BOF { border-left-color: var(--bof); }
.sl.f-RET { border-left-color: var(--ret); } .sl.f-WIN { border-left-color: var(--win); }
.agenda.pl .ar { grid-template-columns: 46px minmax(0, 1fr); align-items: start; }
.agenda.pl .ar.promo .date b { color: var(--gold); }
.brief .sec { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 8px; }
.brief .sec > .label { margin: 0; }
.brief ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 13.5px; }
.brief .ctas { display: grid; gap: 6px; }
.brief .ctas div { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 8px; font-size: 12.5px; padding: 6px 8px; background: var(--sunk); border-radius: 8px; }
.brief .ctas b { overflow-wrap: anywhere; }
.brief .pics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.brief .pics i { aspect-ratio: 4 / 5; border-radius: 6px; overflow: hidden; background: var(--sunk); display: block; }
.brief .pics img { width: 100%; height: 100%; object-fit: cover; display: block; }
.chip.strike { text-decoration: line-through; }
.qa { border-left: 3px solid var(--rose); background: var(--rose-soft); border-radius: 0 8px 8px 0; padding: 8px 11px; font-size: 12.5px; color: var(--ink); }
.qa b { color: var(--rose); }

/* sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 60; top: 0; right: 0; bottom: 0; width: min(1240px, 100vw); background: var(--bg); box-shadow: var(--shadow-lift); transform: translateX(104%); transition: transform .3s cubic-bezier(.2, .8, .2, 1); display: grid; grid-template-rows: auto minmax(0, 1fr); }
.sheet.on { transform: none; }
.sheet .bar1 { display: flex; gap: 10px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--surface); min-width: 0; }
.sheet .bar1 .who { min-width: 0; }
.sheet .bar1 .who span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 600px) { .sheet .bar1 .who span { display: none; } .sheet .bar1 .who b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } }
.sheet .bar1 .who { font-size: 13px; }
.sheet .bar1 .sp { margin-left: auto; display: flex; gap: 6px; flex: none; }
.sheet .in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 460px); min-height: 0; }
.sheet .render { overflow-y: auto; overflow-x: hidden; padding: 0 20px 28px; background: var(--sunk); display: flex; justify-content: center; min-width: 0; }
.sheet .render .paper { width: 100%; max-width: 600px; border-radius: 6px; overflow: hidden; box-shadow: var(--shadow-lift); background: #fff; align-self: flex-start; }
.sheet .render img { width: 100%; display: block; }
.sheet .render .cut { text-align: center; padding: 10px; font-size: 12px; color: #6D695C; background: #F5F4EF; }
.sheet .read { overflow-y: auto; overflow-x: hidden; padding: 20px 24px 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-content: start; min-width: 0; }
.sheet .read > * { min-width: 0; }
.sheet .read .chip { white-space: normal; text-align: left; line-height: 1.35; }
.sheet .read .box, .sheet .read .kv .v, .sheet .read h2, .ours { overflow-wrap: anywhere; }
.sheet .read h2 { margin: 0; font-size: 21px; line-height: 1.3; }
.kv { display: grid; gap: 4px; }
.kv .lbl { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 800; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.kv .v { font-size: 14px; }
.box { border-radius: 10px; padding: 12px 14px; }
.box.steal { background: var(--acc-soft); }
.box.us { background: var(--gold-soft); }
.box .k { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 800; margin-bottom: 4px; }
.box.steal .k { color: var(--acc); } .box.us .k { color: var(--gold); }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatches button { width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--line); padding: 0; }
.copytext { font-size: 13px; color: var(--ink-2); white-space: pre-wrap; max-height: 220px; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.sim { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.sim button { padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; aspect-ratio: 4 / 5; background: var(--sunk); }
.sim img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
@media (max-width: 1000px) { .sheet .in { grid-template-columns: minmax(0, 1fr); overflow-y: auto; overflow-x: hidden; } .sheet .render { overflow: visible; padding: 0 12px 20px; } .sheet .read { overflow: visible; padding: 18px 16px 48px; } }

/* drawer */
.drawer { position: fixed; z-index: 60; top: 0; right: 0; bottom: 0; width: min(380px, 100vw); background: var(--surface); box-shadow: var(--shadow-lift); transform: translateX(104%); transition: transform .3s cubic-bezier(.2, .8, .2, 1); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.drawer.on { transform: none; }
.drawer header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.drawer header b { font-size: 16px; }
.drawer .fbody { overflow-y: auto; padding: 14px 18px; display: grid; gap: 16px; align-content: start; }
.drawer footer { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: space-between; }
.fgroup { display: grid; gap: 7px; }

/* lock */
.lock { position: fixed; inset: 0; z-index: 80; background: radial-gradient(circle at 30% 20%, var(--acc-soft), var(--bg) 60%); display: grid; place-items: center; padding: 24px 16px; }
.lock-card { width: min(390px, 100%); display: grid; gap: 12px; padding: 28px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow-lift); animation: rise .5s both; }
.lock-card svg.lg { width: 52px; height: 52px; }
.lock-card b { font-size: 28px; font-weight: 800; letter-spacing: -.025em; line-height: 1; }
.lock-card .tag { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-top: -6px; }
.lock-card > span { color: var(--muted); font-size: 13.5px; }
.lock-card input[type="password"] { border: 1px solid var(--line); background: var(--bg); padding: 11px 13px; font-size: 15px; border-radius: 10px; }
.lock-card .rem { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.lock-card .err { color: var(--rose); font-size: 13px; min-height: 18px; }
.lock-card .btn { justify-content: center; padding: 11px; }
.loading { position: fixed; inset: 0; z-index: 75; display: grid; place-items: center; background: var(--bg); }
.loading div { display: grid; gap: 10px; justify-items: center; color: var(--muted); font-size: 13px; }
.loading svg { width: 46px; height: 46px; animation: bob 1.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px) rotate(-4deg); } }

.toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px); opacity: 0; background: var(--brand); color: var(--on-brand); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 13px; z-index: 90; transition: all .25s; pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* our version */
.sheet .render { flex-direction: column; justify-content: flex-start; align-items: center; gap: 14px; }   /* centred on the scroll axis, a tall email overflows upward where it can't be scrolled to */
.sheet .render > * { flex-shrink: 0; }   /* a clipped flex child (the email frame) would otherwise shrink to the pane and cut the email */
.sheet .render .paper { align-self: center; }
.rtabs { position: sticky; top: 0; z-index: 3; display: flex; justify-content: center; width: 100%; padding: 14px 0 10px; background: var(--sunk); }
.rtabs .seg { background: var(--surface); box-shadow: var(--shadow); }
.rtabs .seg button { display: inline-flex; gap: 6px; align-items: center; padding: 8px 16px; font-size: 13px; }
.rtabs .seg button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); box-shadow: none; }
.sheet .render > .paper:first-child, .sheet .render > .tplwrap:first-child { margin-top: 20px; }
.tplwrap { width: 100%; max-width: 600px; }
.tplwrap iframe { width: 100%; min-height: 640px; border: 0; display: block; background: #fff; border-radius: 6px; box-shadow: var(--shadow-lift); }
.ours { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; box-shadow: var(--shadow); }
.ours .hd { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.ours .hd > div { min-width: 0; }
.ours .hd .btn { flex: none; }
.ours .hd b { font-size: 16px; display: block; line-height: 1.3; }
.ours .hd small { color: var(--muted); font-size: 12.5px; display: block; margin-top: 3px; }
.ours .acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.ours .acts .btn { justify-content: center; }
.ours .line, .brief .line { display: grid; gap: 2px; padding: 8px 10px; border-radius: 9px; background: var(--sunk); }
.ours .line span, .brief .line span { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 800; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.ours .line b, .brief .line b { font-size: 14px; overflow-wrap: anywhere; }
.btn.small { padding: 6px 11px; font-size: 12.5px; }
.chip.sage { background: var(--sage-soft); color: var(--sage); }
.tplrow { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); cursor: pointer; }
.tplrow:first-of-type { border-top: 0; }
.tplrow .media { border-radius: 8px; }
.tplrow b { display: block; font-size: 14px; }
.tplrow small { display: block; color: var(--muted); font-size: 12.5px; }
.tplrow .q { font-weight: 700; font-size: 13.5px; margin-top: 3px; }
.ref .ourv { display: flex; gap: 8px; align-items: center; justify-content: space-between; border-top: 1px dashed var(--line); padding-top: 8px; font-size: 12.5px; }
.ref .ourv b { color: var(--sage); }

/* the play we stole */
.smap { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.smap .h, .smap .r { display: grid; grid-template-columns: 84px minmax(0, 1fr) minmax(0, 1fr); }
.smap .h span { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 800; color: var(--muted); padding: 7px 9px; background: var(--sunk); }
.smap .r > * { padding: 8px 9px; font-size: 12.5px; line-height: 1.42; border-top: 1px solid var(--line); overflow-wrap: anywhere; min-width: 0; }
.smap .r b { font-size: 11px; color: var(--muted); font-weight: 800; text-transform: capitalize; }
.smap .r .o { background: color-mix(in srgb, var(--gold-soft) 70%, transparent); color: var(--ink); }
.moment { display: flex; gap: 10px; align-items: flex-start; background: var(--acc-soft); border-radius: 10px; padding: 9px 11px; }
.moment b { display: block; font-size: 13.5px; }
.moment small { display: block; font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.proposal { border-left: 3px solid var(--gold); background: var(--gold-soft); border-radius: 0 8px 8px 0; padding: 9px 11px; font-size: 12.5px; line-height: 1.45; }
.proposal b { color: var(--gold); }
.ours .note { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }
/* v7: their email line by line, and what it teaches us */
.mirror { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.mirror .h, .mirror .r { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.mirror .h span { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 800; color: var(--muted); padding: 7px 9px; background: var(--sunk); }
